name: CMLM-CI

permissions:
  contents: read

on:
   workflow_dispatch:
   push:
     branches: [development]
   pull_request:
     branches: [development]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: true

jobs:
  Formatting:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        poetry-version: ['2.1.3']
    defaults:
      run:
        working-directory: ${{github.workspace}}
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name: Setup Poetry
        uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: ${{matrix.poetry-version}}
      - name: Install Dependencies using Poetry
        run: poetry install --extras dev
      - name: Formatting with black
        run: poetry run black --check cmlm/ run_scripts/ tests/
      - name: Sort imports with isort
        run: poetry run isort --check-only --diff cmlm/ run_scripts/ tests/
      - name: Lint with flake8
        run: poetry run flake8 cmlm/ run_scripts/ tests/
  Codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          # Install Python packages
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run codespell
        run: codespell cmlm/ docs/ run_scripts/ --skip="*.bib,*.csv,*.pdf"
        #run: codespell --skip="*.bib,*.csv,*.pdf"
  Test:
    runs-on: ubuntu-latest

    name: Test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        os: ['ubuntu-latest', 'macos-latest']
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name:  Dependencies
        run: |
          # Install Python packages
          pip install .[dev]
      - name: Tests
        run: |
          cd tests
          pytest -v